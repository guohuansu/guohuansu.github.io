name: Deploy website
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Prepare static website
        run: |
          mkdir "$RUNNER_TEMP/site"
          cp index.html "$RUNNER_TEMP/site/"
          cp -R assets data pdf "$RUNNER_TEMP/site/"
          touch "$RUNNER_TEMP/site/.nojekyll"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
